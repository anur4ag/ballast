[package]
name = "ballast"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Keep your machine responsive while coding agents work"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
