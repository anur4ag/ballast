[package]
name = "ballast"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Keep your machine responsive while coding agents work"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[build-dependencies]
cc = "1"
