<svg xmlns="http://www.w3.org/2000/svg" width="686.8" height="628" viewBox="0 0 686.8 628">
<title>Ballast live terminal capture</title>
<rect width="686.8" height="628" rx="10" fill="#14181d"/>
<g font-family="Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="20" y="36" fill="#d0d0d0" font-weight="400" textLength="529.2" lengthAdjust="spacingAndGlyphs">Ballast&#160;keeps&#160;your&#160;machine&#160;responsive&#160;while&#160;coding&#160;agents&#160;work.</text>
<text x="20" y="57" fill="#d0d0d0" font-weight="400" textLength="218.4" lengthAdjust="spacingAndGlyphs">Found:&#160;Claude&#160;Code&#160;&#160;&#160;Codex</text>
<text x="20" y="99" fill="#d0d0d0" font-weight="400" textLength="109.2" lengthAdjust="spacingAndGlyphs">Ballast&#160;will:</text>
<text x="20" y="120" fill="#d0d0d0" font-weight="400" textLength="512.4" lengthAdjust="spacingAndGlyphs">&#160;&#160;1.&#160;[x]&#160;Start&#160;a&#160;background&#160;service&#160;(runs&#160;as&#160;you,&#160;never&#160;root)</text>
<text x="20" y="141" fill="#d0d0d0" font-weight="400" textLength="436.8" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;~/Library/LaunchAgents/dev.ballast.daemon.plist</text>
<text x="20" y="162" fill="#d0d0d0" font-weight="400" textLength="184.8" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;Creates&#160;this&#160;file</text>
<text x="20" y="183" fill="#d0d0d0" font-weight="400" textLength="495.6" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;Private&#160;runtime,&#160;state&#160;and&#160;log&#160;directories:&#160;~/.ballast</text>
<text x="20" y="204" fill="#d0d0d0" font-weight="400" textLength="277.2" lengthAdjust="spacingAndGlyphs">&#160;&#160;2.&#160;[x]&#160;Set&#160;up&#160;Claude&#160;Code&#160;hooks</text>
<text x="20" y="225" fill="#d0d0d0" font-weight="400" textLength="235.2" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;~/.claude/settings.json</text>
<text x="20" y="246" fill="#d0d0d0" font-weight="400" textLength="487.2" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;Backup:&#160;settings.json.ballast-2026-09-25T05-25-38.bak</text>
<text x="20" y="267" fill="#d0d0d0" font-weight="400" textLength="646.8" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;+&#160;PreToolUse&#160;(Bash,&#160;Monitor):&#160;holds&#160;heavy&#160;commands&#160;under&#160;memory&#160;pressure</text>
<text x="20" y="288" fill="#d0d0d0" font-weight="400" textLength="428.4" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;+&#160;PostToolUse&#160;(Bash):&#160;explains&#160;port&#160;collisions</text>
<text x="20" y="309" fill="#d0d0d0" font-weight="400" textLength="403.2" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;+&#160;4&#160;lifecycle&#160;events:&#160;shows&#160;agent&#160;state&#160;in&#160;</text>
<text x="423.2" y="309" fill="#d0d0d0" font-weight="700" textLength="92.4" lengthAdjust="spacingAndGlyphs">ballast&#160;top</text>
<text x="20" y="330" fill="#d0d0d0" font-weight="400" textLength="428.4" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;Keeps&#160;your&#160;1&#160;other&#160;hook&#160;and&#160;all&#160;other&#160;settings</text>
<text x="20" y="351" fill="#d0d0d0" font-weight="400" textLength="226.8" lengthAdjust="spacingAndGlyphs">&#160;&#160;3.&#160;[x]&#160;Set&#160;up&#160;Codex&#160;hooks</text>
<text x="20" y="372" fill="#d0d0d0" font-weight="400" textLength="201.6" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;~/.codex/hooks.json</text>
<text x="20" y="393" fill="#d0d0d0" font-weight="400" textLength="184.8" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;Creates&#160;this&#160;file</text>
<text x="20" y="414" fill="#d0d0d0" font-weight="400" textLength="571.2" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;+&#160;PreToolUse&#160;(Bash):&#160;holds&#160;heavy&#160;commands&#160;under&#160;memory&#160;pressure</text>
<text x="20" y="435" fill="#d0d0d0" font-weight="400" textLength="428.4" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;+&#160;PostToolUse&#160;(Bash):&#160;explains&#160;port&#160;collisions</text>
<text x="20" y="456" fill="#d0d0d0" font-weight="400" textLength="403.2" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;+&#160;4&#160;lifecycle&#160;events:&#160;shows&#160;agent&#160;state&#160;in&#160;</text>
<text x="423.2" y="456" fill="#d0d0d0" font-weight="700" textLength="92.4" lengthAdjust="spacingAndGlyphs">ballast&#160;top</text>
<text x="20" y="477" fill="#d0d0d0" font-weight="400" textLength="285.6" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;Keeps&#160;all&#160;your&#160;other&#160;settings</text>
<text x="20" y="498" fill="#d0d0d0" font-weight="700" textLength="336" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;Approval&#160;needed:&#160;open&#160;Codex&#160;/hooks.</text>
<text x="20" y="540" fill="#d0d0d0" font-weight="400" textLength="613.2" lengthAdjust="spacingAndGlyphs">Never&#160;sends&#160;data&#160;anywhere,&#160;kills&#160;your&#160;own&#160;apps,&#160;or&#160;kills&#160;a&#160;running&#160;agent.</text>
<text x="20" y="561" fill="#d0d0d0" font-weight="400" textLength="117.6" lengthAdjust="spacingAndGlyphs">Undo&#160;anytime:&#160;</text>
<text x="137.6" y="561" fill="#d0d0d0" font-weight="700" textLength="142.8" lengthAdjust="spacingAndGlyphs">ballast&#160;uninstall</text>
<text x="20" y="603" fill="#d0d0d0" font-weight="400" textLength="352.8" lengthAdjust="spacingAndGlyphs">Continue?&#160;[Y]es&#160;/&#160;[c]hoose&#160;/&#160;[d]iff&#160;/&#160;[n]o</text>
</g>
</svg>
