0;hooks</text><text x="20" y="350">&#160;&#160;&#160;&#160;&#160;~/.codex/hooks.json</text><text x="20" y="370">&#160;&#160;&#160;&#160;&#160;+&#160;PreToolUse&#160;(Bash):&#160;holds&#160;heavy&#160;commands&#160;under&#160;memory&#160;pressure</text><text x="20" y="390">&#160;&#160;&#160;&#160;&#160;+&#160;PostToolUse&#160;(Bash):&#160;explains&#160;port&#160;collisions</text><text x="20" y="410">&#160;&#160;&#160;&#160;&#160;+&#160;4&#160;lifecycle&#160;events:&#160;shows&#160;agent&#160;state&#160;in&#160;ballast&#160;top</text><text x="20" y="430">&#160;&#160;&#160;&#160;&#160;0&#160;existing&#160;hooks&#160;are&#160;kept.</text><text x="20" y="450">&#160;&#160;&#160;&#160;&#160;Codex&#160;asks&#160;you&#160;to&#160;approve&#160;hooks&#160;once&#160;(/hooks).</text><text x="20" y="470">&#160;&#160;&#160;&#160;&#160;Your&#160;other&#160;hooks&#160;and&#160;settings&#160;are&#160;kept</text><text x="20" y="490"></text><text x="20" y="510">What&#160;it&#160;never&#160;does:&#160;send&#160;data&#160;anywhere,&#160;kill&#160;your&#160;own&#160;apps,&#160;or&#160;kill&#160;a&#160;running</text><text x="20" y="530">agent.</text><text x="20" y="550">Undo&#160;anytime:&#160;ballast&#160;uninstall</text><text x="20" y="570"></text><text x="20" y="590">Continue?&#160;[Y]es&#160;/&#160;[c]hoose&#160;/&#160;[d]iff&#160;/&#160;[n]o</text></g></svg>
